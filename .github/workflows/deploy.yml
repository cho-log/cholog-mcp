# 배포. 지금은 build 작업만 있다: 데이터 수집 → DB → 점검 → 이미지 빌드.
# AWS에 올리는 deploy 작업은 이 뒤에 붙인다.
name: 배포

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_previous_check:
        description: "직전 비교 건너뛰기 (PR이나 코멘트가 실제로 많이 지워져서 비교가 계속 실패할 때)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read # 직전 실행의 DB 결과물을 내려받는다

# 배포는 한 번에 하나씩. 진행 중인 배포는 끊지 않는다. 대기는 하나만 남고, 더 오면 먼저 기다리던 것이
# 취소된다. 매번 데이터를 전부 새로 받으므로 마지막 실행만 돌아도 결과는 같다.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm # Lambda와 같은 arm64에서 빌드한다
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }} # pipeline fetch가 쓰는 gh CLI의 토큰. 실제 한도는 시간당 5,000회였다
      TZ: Asia/Seoul # 수집 시각(data_as_of)을 한국 시간으로 남긴다
    defaults:
      run:
        shell: bash # -eo pipefail: 파이프 중간 명령이 실패해도 단계가 실패한다
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked

      - name: 미션 목록
        id: missions
        run: |
          # 변수에 먼저 담는다. echo 안의 $(...)는 실패해도 단계가 실패하지 않는다.
          ids=$(uv run python -c 'from cholog_mcp.missions import MISSIONS; print(" ".join(MISSIONS))')
          if [ -z "$ids" ]; then echo "미션 목록이 비었다"; exit 1; fi
          echo "ids=$ids" >> "$GITHUB_OUTPUT"

      - name: API 호출 한도 (수집 전)
        id: before
        run: |
          remaining=$(gh api rate_limit --jq .resources.core.remaining)
          echo "remaining=$remaining" >> "$GITHUB_OUTPUT"

      - name: 수집
        run: |
          for mission in ${{ steps.missions.outputs.ids }}; do
            uv run python -m pipeline fetch "$mission"
          done

      - name: API 호출 한도 (수집 후)
        id: after
        run: |
          remaining=$(gh api rate_limit --jq .resources.core.remaining)
          limit=$(gh api rate_limit --jq .resources.core.limit)
          echo "remaining=$remaining" >> "$GITHUB_OUTPUT"
          echo "limit=$limit" >> "$GITHUB_OUTPUT"

      - name: 직전 DB 내려받기
        id: previous
        if: ${{ !inputs.skip_previous_check }}
        run: |
          # 이 브랜치에서 마지막으로 성공한 실행의 DB. 없거나 보관 기간이 지났으면 비교를 건너뛴다.
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch "$GITHUB_REF_NAME" \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run_id" ] && gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n cholog-db -D previous; then
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          else
            echo "직전 DB가 없어서 직전 비교는 건너뛴다"
          fi

      - name: 적재, 분류, 점검
        run: |
          for mission in ${{ steps.missions.outputs.ids }}; do
            uv run python -m pipeline load "$mission"
            uv run python -m pipeline tag "$mission"
            # 점검 결과를 파일로도 남겨, 점검이 실패해도 요약에서 볼 수 있게 한다.
            uv run python -m pipeline check "$mission" --previous previous/cholog.db | tee "check-$mission.txt"
          done

      - name: 이미지 빌드
        run: docker build -t cholog-mcp:${{ github.sha }} .

      - uses: actions/upload-artifact@v7
        with:
          name: cholog-db
          path: data/cholog.db
          retention-days: 30

      - name: 요약
        if: ${{ always() }} # 점검이 실패했을 때 가장 필요하다
        run: |
          {
            echo "## 빌드 결과"
            for mission in ${{ steps.missions.outputs.ids }}; do
              echo
              echo "### $mission"
              if [ -f "check-$mission.txt" ]; then
                echo '```'
                cat "check-$mission.txt"
                echo '```'
              else
                echo "점검까지 가지 못했다"
              fi
            done
            echo
            before="${{ steps.before.outputs.remaining }}"
            after="${{ steps.after.outputs.remaining }}"
            if [ -n "$before" ] && [ -n "$after" ] && [ "$before" -ge "$after" ]; then
              echo "- GitHub API 호출: $((before - after))회 (시간당 한도 ${{ steps.after.outputs.limit }}회, 남은 것 ${after}회)"
            else
              echo "- GitHub API 호출: 셀 수 없음 (수집 전에 멈췄거나, 수집 중에 한도가 초기화됐다)"
            fi
            if [ "${{ inputs.skip_previous_check }}" = "true" ]; then
              echo "- 직전 비교: 건너뜀 (수동 실행에서 선택)"
            elif [ -n "${{ steps.previous.outputs.run_id }}" ]; then
              echo "- 직전 비교: 실행 ${{ steps.previous.outputs.run_id }}의 DB"
            else
              echo "- 직전 비교: 건너뜀 (직전 DB 없음)"
            fi
            if docker image inspect "cholog-mcp:${{ github.sha }}" > /dev/null 2>&1; then
              echo "- 이미지 크기: $(docker image inspect "cholog-mcp:${{ github.sha }}" --format '{{.Size}}' | numfmt --to=iec)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
